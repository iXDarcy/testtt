name: Windows RDP (via Tailscale)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Session length in minutes (1-350)'
        required: false
        default: '300'

permissions:
  contents: read

concurrency:
  group: windows-rdp
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RDP_PORT: '3389'
    steps:
      - name: Validate secrets and inputs
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          MINUTES_IN: ${{ inputs.minutes }}
        run: |
          if ([string]::IsNullOrEmpty($env:VNC_PASSWORD)) {
            Write-Error "VNC_PASSWORD secret is not set"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:TS_AUTHKEY)) {
            Write-Error "TS_AUTHKEY secret is not set (Tailscale admin console -> Settings -> Keys)"
            exit 1
          }
          $minutes = 300
          [int]::TryParse($env:MINUTES_IN, [ref]$minutes) | Out-Null
          if ($minutes -lt 1) { $minutes = 1 }
          if ($minutes -gt 350) { $minutes = 350 }
          "SESSION_MINUTES=$minutes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Keep system awake
        run: |
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0

      - name: Create login account
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $NewUser = "ciadmin"
          $SecurePw = ConvertTo-SecureString $env:VNC_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name $NewUser -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $NewUser -Password $SecurePw
            Write-Host "Reset password for existing user '$NewUser'"
          } else {
            New-LocalUser -Name $NewUser -Password $SecurePw -FullName "CI Admin" -PasswordNeverExpires -AccountNeverExpires
            Write-Host "Created user '$NewUser'"
          }
          Add-LocalGroupMember -Group "Administrators" -Member $NewUser -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $NewUser -ErrorAction SilentlyContinue

          # Verify the password actually took
          Add-Type -AssemblyName System.DirectoryServices.AccountManagement
          $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')
          $ok = $ctx.ValidateCredentials($NewUser, $env:VNC_PASSWORD)
          if ($ok) { Write-Host "OK: '$NewUser' accepts the secret password" }
          else { Write-Error "'$NewUser' does not accept the secret password" }

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          # Disable Network Level Authentication so mobile RDP clients connect without extra fuss
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Set-NetFirewallRule -Enabled True -Profile Any

          $ok = $false
          for ($i = 0; $i -lt 15; $i++) {
            if (Test-NetConnection -ComputerName 127.0.0.1 -Port $env:RDP_PORT -InformationLevel Quiet -WarningAction SilentlyContinue) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Write-Error "RDP port $($env:RDP_PORT) is not listening"
            exit 1
          }
          Write-Host "RDP is listening on port $($env:RDP_PORT)"

      - name: Install and start Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          choco install tailscale -y --no-progress | Out-Null

          Set-Service -Name Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            $tailscale = "tailscale"  # fall back to PATH
          }

          $hostName = "gh-win-" + (Get-Random -Maximum 999999)
          & $tailscale up --authkey="$env:TS_AUTHKEY" --hostname="$hostName" --accept-dns=true --timeout=60s

          $tsIp = ""
          for ($i = 0; $i -lt 15; $i++) {
            $tsIp = (& $tailscale ip -4 2>$null | Select-Object -First 1)
            if ($tsIp) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $tsIp) {
            Write-Error "Tailscale did not come up"
            & $tailscale status
            exit 1
          }

          $tsDns = ""
          try {
            $status = (& $tailscale status --json) | ConvertFrom-Json
            $tsDns = $status.Self.DNSName.TrimEnd('.')
          } catch {}

          Write-Host "RDP_ENDPOINT: $tsIp`:$($env:RDP_PORT)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @"
### Connect from your phone (Microsoft Remote Desktop app)

``````
Host: $tsIp
$(if ($tsDns) { "# or host: $tsDns" })
Port: 3389
User: ciadmin
``````
Password: your VNC_PASSWORD secret

Your phone must have the Tailscale app installed and signed into the same account.
"@

      - name: Keep alive
        run: |
          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) { $tailscale = "tailscale" }

          $end = (Get-Date).AddMinutes([int]$env:SESSION_MINUTES)
          $nextReport = (Get-Date).AddMinutes(30)
          Write-Host "Session: $($env:SESSION_MINUTES) min. Cancel the run to stop it early."

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 30

            if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port $env:RDP_PORT -InformationLevel Quiet -WarningAction SilentlyContinue)) {
              Write-Warning "RDP service looks down, restarting..."
              Restart-Service -Name TermService -ErrorAction SilentlyContinue
            }

            & $tailscale status *> $null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "tailscaled looks down, restarting service..."
              Restart-Service -Name Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }

            if ((Get-Date) -ge $nextReport) {
              $tsIp = (& $tailscale ip -4 2>$null | Select-Object -First 1)
              $minsLeft = [int](($end - (Get-Date)).TotalMinutes)
              Write-Host "RDP_ENDPOINT: $tsIp`:$($env:RDP_PORT)  (~$minsLeft min left)"
              $nextReport = (Get-Date).AddMinutes(30)
            }
          }
          Write-Host "Session finished."
